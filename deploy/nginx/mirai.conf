# Nginx sites for MIRAI. Copy to /etc/nginx/sites-available/mirai.conf, replace the three
# domains below with yours, then:
#   sudo ln -s /etc/nginx/sites-available/mirai.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d API_DOMAIN -d ADMIN_DOMAIN -d SITE_DOMAIN   (adds HTTPS)

# --- API (Node backend on port 5000, managed by PM2) ---
server {
    listen 80;
    server_name api.miraiastro.com;          # API_DOMAIN

    client_max_body_size 30m;                         # media uploads (5 images x 5 MB)

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                      # AI replies can take a while
    }
}

# --- Admin panel (static build of mirai-admin-panel) ---
server {
    listen 80;
    server_name admin.miraiastro.com;    # ADMIN_DOMAIN

    root /var/www/mirai-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;             # React Router
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --- Website (static build of mirai-react) ---
server {
    listen 80;
    server_name miraiastro.com www.miraiastro.com;    # SITE_DOMAIN

    root /var/www/mirai-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
